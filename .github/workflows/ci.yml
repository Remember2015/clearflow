name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run setup
      - run: npm run build
      - name: Built files are up to date
        run: git diff --exit-code -- extension
      - run: npm run test:unit
      - run: npm run pack

  browser-tests:
    runs-on: ubuntu-latest
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run setup
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk locales && sudo locale-gen zh_CN.UTF-8 ja_JP.UTF-8
      # The tests check Chinese UI text. On Linux, Chrome takes its UI language from LANGUAGE / LANG, not from --lang
      # (macOS reads -AppleLanguages), so without these the extension pages come up in English.
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
          LANGUAGE: zh_CN:zh
          LANG: zh_CN.UTF-8

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a license key for organization repos; the container doesn't
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact --verbose
