    get: async (k) => { const ks = k === null ? Object.keys(store) : Array.isArray(k) ? k : [k]; return Object.fromEntries(ks.filter((x) => x in store).map((x) => [x, store[x]])); },
    set: async (o) => Object.assign(store, o), remove: async (k) => { for (const x of Array.isArray(k) ? k : [k]) delete store[x]; },
  } },
  runtime: { onMessage: { addListener: (f) => (listener = f) }, getURL: (p) => "chrome-extension://fakeid/" + p },

};

jevStatus = 200;
r = await call({ type: "jev", postId: "P9", post: "p", replies: [{ id: "1900000000000000303", text: "health 测试 4" }] });
await new Promise((res) => setTimeout(res, 50));
// 0.28.8：统计只收计数（坏的值以前会和数字拼成字符串，把统计永久弄坏）
const statDay = new Date().toLocaleDateString("sv-SE");
const seenBefore = store.ff_stats?.[statDay]?.seen || 0;
await call({ type: "stat", delta: { seen: 2, fold_jev: "3", tokens: -5, "bad key!": 1, posts: Infinity } });
const sd = store.ff_stats?.[statDay] || {};
ok("统计只收计数：数字照加，字符串、负数、无穷大、怪名字都不收", sd.seen === seenBefore + 2 && typeof sd.fold_jev !== "string" && !(sd.tokens < 0) && !("bad key!" in sd) && sd.posts !== Infinity, JSON.stringify(sd));

// ---- 0.11 去掉首页 Feed 记录：留在存储里的键删掉 ----
store.ff_feed_generation = 3; store["ff_feed_outbox:p:1"] = { items: [] }; store.ff_feed_session = { id: 1 };
await bg.dropFeedData();
ok("首页记录留下的键删掉了，别的不动", !Object.keys(store).some((k) => k.startsWith("ff_feed_")) && (await call({ type: "settings" })).hasKey);

document.getElementById("out").textContent = out.join("\n");
// 0.24：评测记录（"记录 Reddit 评论（评估用）"）和 Reddit 的结构探针去掉了：发 evalRecord 没人管，导出不带，升级时删掉它们留下的键
{
  store.ff_eval_reddit = { posts: {}, items: [{ id: "t1_old" }] }; store.ff_eval_reddit_n = 1; store.ff_dev_reddit = { post: {} };
  const r = await call({ type: "evalRecord", post: { id: "r:t3_ev1", text: "合成的帖子" }, items: [] });
  ok("评测记录：后台不认这个消息了", !r || !r.ok, JSON.stringify(r));
  const ex = await call({ type: "export" });
  ok("导出数据不带评测记录", !("ff_eval_reddit" in (ex.data || {})), JSON.stringify(Object.keys(ex.data || {})));
  await bg.dropDevData();
  ok("升级时删掉评测记录和探针留下的键，别的不动", !("ff_eval_reddit" in store) && !("ff_eval_reddit_n" in store) && !("ff_dev_reddit" in store) && (await call({ type: "settings" })).hasKey, JSON.stringify(Object.keys(store)));
}
// 0.28.12：key 不在 storage.local 里了（内容脚本读得到那里）：旧版本存的挪进插件自己的 IndexedDB、从 storage.local 删掉，
// storage.local 只留 ff_keys（填没填）；存 key 只收插件自己的页面发来的
{
  const st = await call({ type: "settings" });
  ok("升级：storage.local 里的 key 挪走了，只留填没填", !("ff_key" in store) && !("ff_or_key" in store) && store.ff_keys?.jev === true && store.ff_keys?.or === true && st.hasKey && st.hasOrKey,
    JSON.stringify({ keys: Object.keys(store).filter((k) => /key/.test(k)), flags: store.ff_keys }));
  const noKeyText = !JSON.stringify(store).includes("test-key") && !JSON.stringify(store).includes("test-or-key");
  ok("storage.local 里哪儿都找不到 key 本身", noKeyText, JSON.stringify(store.ff_keys));
  const bad = await callFrom("https://x.com/a/status/1", { type: "setKey", which: "jev", value: "evil-key" });
  ok("网站页面里发来的 setKey 不收", bad.code === "invalid_request", JSON.stringify(bad));
  const at0 = store.ff_keys.at;
  await new Promise((r) => setTimeout(r, 5));
  const good = await callFrom("chrome-extension://fakeid/options.html", { type: "setKey", which: "jev", value: " new-test-key " });
  let sent = null;
  const jevFetch = globalThis.fetch;
  globalThis.fetch = async (url, init) => { sent = init.headers.Authorization; return jevFetch(url, init); };
  await call({ type: "jev", postId: "K1", post: "p", replies: [{ id: "1900000000000000999", text: "换了 key 以后" }] });
  globalThis.fetch = jevFetch;
  ok("设置页存 key：用新的、ff_keys 记下换 key 的时间、storage.local 里还是没有 key", good.ok && sent === "Bearer new-test-key" && store.ff_keys.at > at0 && !JSON.stringify(store).includes("new-test-key"),
    JSON.stringify({ good, sent: !!sent, flags: store.ff_keys }));
  const t = await call({ type: "testKey", key: "", lang: "zh-CN" });
  ok("测试连接不给 key（设置页看不到存着的）：测存着的那个", t.ok === true, JSON.stringify(t));
  await callFrom("chrome-extension://fakeid/options.html", { type: "setKey", which: "jev", value: "test-key" });
}
// 0.16.1：工具栏图标跟浏览器的深浅色（页面报的）：深色换 dark-*，一样的不重设，浅色换回 icon-*
{
  await call({ type: "theme", dark: true });
  await call({ type: "theme", dark: true });
  await call({ type: "theme", dark: false });
  const ic = globalThis.__icons || [];
  ok("工具栏图标：深色换 dark-*、一样的不重设、浅色换回", ic.length === 2 && ic[0].path[16] === "icons/dark-16.png" && ic[0].path[32] === "icons/dark-32.png" &&
    ic[1].path[16] === "icons/icon-16.png", JSON.stringify(ic));
}
// 0.18 看回复里的图片：开着时把回复里的图下载、缩成 JPEG 装进 assets，请求带 Danger Zone 头；关着整个去掉；不认识的网站不下载；
// 下载失败的图不发；Jev 因为图把整批拒了（400）就去掉图再问一次、结果不进缓存；没字的回复图又没读到就不问。
// 0.28.7（review）：图没了（404）的结果照样进缓存，一时读不到（网络出错、503）的不进；没给读图权限当关着；一批超过 6 张的那几条不发图、结果照样进缓存
{
  const png = await (async () => { const c = new OffscreenCanvas(1200, 800); const x = c.getContext("2d"); x.fillStyle = "#c33"; x.fillRect(0, 0, 1200, 800); return c.convertToBlob({ type: "image/png" }); })();
  const seen = [], bodies = [];
  let lastHeaders = null, reject400 = false;
  const jevFetch = globalThis.fetch;
  globalThis.fetch = async (url, init) => {
    if (String(url).startsWith("https://api.typesafe.ai/")) {
      lastHeaders = init.headers;
      const b = JSON.parse(init.body);
      bodies.push(b);
      if (reject400 && b.assets) { fetchCalls++; return new Response(JSON.stringify({ error_type: "api_usage_error", message: "Invalid image dimensions." }), { status: 400 }); }
      return jevFetch(url, init);
    }
    seen.push(String(url));
    if (String(url).includes("/broken")) return new Response("no", { status: 404 });
    if (String(url).includes("/flaky")) throw new TypeError("Failed to fetch");
    if (String(url).includes("/busy")) return new Response("busy", { status: 503 });
    return new Response(png, { status: 200, headers: { "content-type": "image/png" } });
  };
  const ID = (n) => "19300000000000000" + String(n).padStart(2, "0");
  const msg = (replies) => ({ type: "jev", postId: "IMG", post: "带图的帖子", author: null, replies });
  const R1 = { id: ID(1), text: "look at this", images: ["https://pbs.twimg.com/media/A1.jpg"] };
  const R2 = { id: ID(2), text: "", images: ["http://sns-webpic-qc.xhscdn.com/202610/a/b2"] };
  const R3 = { id: ID(3), text: "third", images: ["https://evil.example.com/x.jpg"] };
  store.ff_settings = { ...store.ff_settings, images: false };
  let before = fetchCalls;
  let r = await call(msg([R1, R3]));
  let b = bodies.at(-1);
  ok("看图片关着：请求里没有图、不带头、不下载图", fetchCalls === before + 1 && !b.assets && b.state.replies.every((x) => !x.images) && !(lastHeaders || {})["TypeSafe-Danger-Zone-Images"] && seen.length === 0,
    JSON.stringify({ assets: !!b.assets, seen }));
  store.ff_settings = { ...store.ff_settings, images: true };
  before = fetchCalls;
  r = await call(msg([R1, R2, R3]));
  b = bodies.at(-1);
  const asset = b.assets && Object.values(b.assets)[0];
  ok("看图片开着：图下载、转成 JPEG 装进 assets，回复里写引用名，请求带 Danger Zone 头", fetchCalls === before + 1 && b.assets && Object.keys(b.assets).length === 2 &&
    asset.type === "image" && asset.format === "jpg" && asset.data_base64.startsWith("/9j/") && lastHeaders["TypeSafe-Danger-Zone-Images"] === "true" &&
    JSON.stringify(b.state.replies.find((x) => x.id === ID(1)).images) === JSON.stringify([`img_${ID(1)}_0`]) && b.state.replies.find((x) => x.id === ID(2)).images.length === 1,
    JSON.stringify({ keys: b.assets && Object.keys(b.assets), replies: b.state.replies.map((x) => [x.id, x.images]), h: lastHeaders }));
  const r3 = b.state.replies.find((x) => x.id === ID(3)); // 图不认识、去掉以后和关着时一样：走关着时的缓存，不一定在这次请求里
  ok("不认识的网站的图不下载、不发；只有图的那条照样判", !seen.some((u) => u.includes("evil")) && (!r3 || !r3.images) && !!r.scores[ID(2)] && !!r.scores[ID(3)],
    JSON.stringify(seen));
  await new Promise((res) => setTimeout(res, 300));
  before = fetchCalls;
  r = await call(msg([R1, R2, R3]));
  ok("同样带图再来一次：走缓存", fetchCalls === before && Object.keys(r.scores).length === 3, `fetch=${fetchCalls - before}`);
  store.ff_settings = { ...store.ff_settings, images: false };
  before = fetchCalls;
  r = await call(msg([R1]));
  ok("关掉看图片：带图的那条重问一次（只问字），不拿开着时的结果", fetchCalls === before + 1 && !bodies.at(-1).assets, `fetch=${fetchCalls - before}`);
  store.ff_settings = { ...store.ff_settings, images: true };
  const RB = { id: ID(4), text: "broken one", images: ["https://pbs.twimg.com/broken/1.jpg"] };
  before = fetchCalls;
  r = await call(msg([RB]));
  ok("图下载失败：不发图、照样按字判", fetchCalls === before + 1 && !bodies.at(-1).assets && !!r.scores[ID(4)], JSON.stringify(bodies.at(-1).state.replies));
  await new Promise((res) => setTimeout(res, 300));
  r = await call(msg([RB]));
  ok("图没了（404）的那次结果照样进缓存：下次走缓存，不再付一次费", fetchCalls === before + 1 && !!r.scores[ID(4)], `fetch=${fetchCalls - before}`);
  const RF = { id: ID(7), text: "flaky one", images: ["https://pbs.twimg.com/flaky/1.jpg", "https://pbs.twimg.com/busy/1.jpg"] };
  before = fetchCalls;
  r = await call(msg([RF]));
  await new Promise((res) => setTimeout(res, 300));
  r = await call(msg([RF]));
  ok("图一时读不到（网络出错、503）：那次结果不进缓存，下次再试", fetchCalls === before + 2 && !!r.scores[ID(7)] && seen.filter((u) => u.includes("/flaky/")).length === 2, `fetch=${fetchCalls - before}`);
  globalThis.__imgPerm = false;
  const RP = { id: ID(8), text: "no permission", images: ["https://pbs.twimg.com/media/P8.jpg"] };
  const seenBefore = seen.length;
  before = fetchCalls;
  r = await call(msg([RP]));
  await new Promise((res) => setTimeout(res, 300));
  r = await call(msg([RP]));
  ok("没给读图的权限：当关着（不下载、不发图），结果进缓存", fetchCalls === before + 1 && !bodies.at(-1).assets && seen.length === seenBefore && !!r.scores[ID(8)], `fetch=${fetchCalls - before} seen=${seen.length - seenBefore}`);
  globalThis.__imgPerm = true;
  const many = [9, 10, 11, 12].map((n) => ({ id: ID(n), text: "pics " + n, images: [`https://pbs.twimg.com/media/M${n}a.jpg`, `https://pbs.twimg.com/media/M${n}b.jpg`] }));
  before = fetchCalls;
  r = await call(msg(many));
  b = bodies.at(-1);
  ok("一批超过 6 张：前三条各 2 张，第四条不发图、照样判", fetchCalls === before + 1 && Object.keys(b.assets || {}).length === 6 && !b.state.replies.find((x) => x.id === ID(12)).images && !!r.scores[ID(12)],
    JSON.stringify(b.state.replies.map((x) => [x.id, x.images])));
  await new Promise((res) => setTimeout(res, 300));
  r = await call(msg(many));
  ok("超出 6 张没发图的那条结果也进了缓存：再来一次全走缓存", fetchCalls === before + 1 && Object.keys(r.scores).length === 4, `fetch=${fetchCalls - before}`);
  const RO = { id: ID(5), text: "", images: ["https://pbs.twimg.com/broken/2.jpg"] };
  before = fetchCalls;
  r = await call(msg([RO]));
  ok("没字、图又没读到：不问 Jev、没有分", fetchCalls === before && !r.scores?.[ID(5)], JSON.stringify(r));
  reject400 = true;
  const RJ = { id: ID(6), text: "rejected image", images: ["https://pbs.twimg.com/media/J6.jpg"] };
  before = fetchCalls;
  r = await call(msg([RJ]));
  ok("Jev 因为图拒了整批（400）：去掉图再问一次，照样有分", fetchCalls === before + 2 && !!r.scores[ID(6)] && !bodies.at(-1).assets, `fetch=${fetchCalls - before}`);
  reject400 = false;
  await new Promise((res) => setTimeout(res, 300));
  r = await call(msg([RJ]));
  ok("被拒那次的结果不进缓存：图好了再问时带图", fetchCalls === before + 3 && !!bodies.at(-1).assets, `fetch=${fetchCalls - before}`);
  globalThis.fetch = jevFetch;
  store.ff_settings = { ...store.ff_settings, images: false };
}
document.getElementById("out").textContent = out.join("\n");
window.__bgTest = out;
