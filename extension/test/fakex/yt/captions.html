<!doctype html><html lang="zh-Hans-CN"><head><meta charset="utf-8"><title>Synthetic captions - YouTube</title><style>body{font:14px/20px Roboto,Arial,sans-serif;margin:0;background:#fff;color:#0f0f0f} #primary{max-width:860px;margin:16px} ytd-watch-metadata h1{font-size:20px;line-height:28px;font-weight:700;margin:0} #channel-name a{color:#0f0f0f;text-decoration:none} #snippet{overflow:hidden;max-height:6rem} ytd-comment-view-model{display:block;margin:16px 0} #header-author{display:flex;gap:6px;font-size:13px} #header-author h3{margin:0;font-size:13px} ytd-expander{display:block} #action-buttons{display:block;font-size:12px;color:#606060} ytd-comment-replies-renderer{display:block;margin-left:56px} .lockup a.ytLockupMetadataViewModelTitle{display:flow-root;-webkit-line-clamp:3;max-height:60px;overflow:hidden;font-size:14px;line-height:20px} ytd-video-renderer{display:block;margin:12px 0} ytd-video-renderer a#video-title{display:flow-root;-webkit-line-clamp:2;max-height:52px;overflow:hidden;font-size:18px;line-height:26px;color:#0f0f0f} .metadata-snippet-text{display:block;-webkit-line-clamp:2;max-height:36px;overflow:hidden;font-size:12px;line-height:18px;color:#606060} .ytAttributedStringWhiteSpacePreWrap{white-space:pre-wrap}</style></head><body><ytd-app><div id="content"><div id="primary"><div id="movie_player" style="position:relative;width:640px;height:360px;background:#000"><video style="width:640px;height:360px"></video><div class="ytp-caption-window-container" style="position:absolute;left:0;right:0;bottom:24px;text-align:center;color:#fff;font:20px sans-serif"></div></div><ytd-watch-metadata><div id="title"><h1 class="style-scope ytd-watch-metadata"><yt-formatted-string class="style-scope ytd-watch-metadata">合成的字幕测试视频</yt-formatted-string></h1></div></ytd-watch-metadata></div><script>
(() => {
  const q = new URLSearchParams(location.search), P = document.getElementById("movie_player"), V = P.querySelector("video"), box = P.querySelector(".ytp-caption-window-container");
  const TRACKS = [{ languageCode: "en", kind: "" }, ...(q.has("nohuman") || q.has("long") ? [] : [{ languageCode: "zh-TW", kind: "" }])];
  // 假的钟：照真播放器走，能拖
  let T = 0, seeking = false;
  Object.defineProperty(V, "currentTime", { configurable: true, get: () => T, set: (x) => window.__seek(x) });
  Object.defineProperty(V, "seeking", { configurable: true, get: () => seeking });
  setInterval(() => { if (!seeking) T += 0.05; }, 50);
  setInterval(() => V.dispatchEvent(new Event("timeupdate")), 250);
  window.__seek = (x) => { seeking = true; V.dispatchEvent(new Event("seeking")); T = x; V.dispatchEvent(new Event("timeupdate")); setTimeout(() => { seeking = false; V.dispatchEvent(new Event("seeked")); }, 20); };
  let cur = null, cues = [], shown = -2;
  P.getOption = (m, k) => (m === "captions" && k === "track" ? (cur || {}) : null);
  P.getPlayerResponse = () => ({ videoDetails: { videoId: "CAPSVID0001" }, captions: { playerCaptionsTracklistRenderer: { captionTracks: TRACKS } } });
  window.__setTrack = (lang, tlang) => {
    cur = { languageCode: lang, kind: "", ...(tlang ? { translationLanguage: { languageCode: tlang } } : {}) };
    const x = new XMLHttpRequest();
    x.open("GET", `/api/timedtext?v=CAPSVID0001&lang=${lang}${tlang ? `&tlang=${tlang}` : ""}${q.has("long") ? "&set=long" : ""}&pot=fakepot&fmt=json3`);
    x.onload = () => { cues = JSON.parse(x.responseText).events.map((e) => ({ t: e.tStartMs / 1000, d: e.dDurationMs / 1000, text: e.segs.map((s) => s.utf8).join("") })); shown = -2; };
    x.send();
  };
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  setInterval(() => {
    const now = V.currentTime, i = cues.findIndex((c) => c.t <= now && now < c.t + c.d);
    if (i === shown) return;
    shown = i;
    box.innerHTML = i < 0 ? "" : `<div class="caption-window ytp-caption-window-bottom"><span class="captions-text">${cues[i].text.split("\n").map((l) => `<span class="caption-visual-line"><span class="ytp-caption-segment">${esc(l)}</span></span>`).join("")}</span></div>`;
  }, 50);
})();
</script></div></ytd-app>
<script id="ff-inject">
const P = "/watch?v=CAPSVID0001", q = location.search.slice(1); // 留着 ?jev=…（替身 Jev 读它）
history.replaceState({}, "", q ? P + (P.includes("?") ? "&" : "?") + q : P);
const sc = document.createElement("script"); sc.src = "/inject_yt.js";
// 评论像真页面一样：先从 youtubei/v1/next 回来数据，再画出来（模板里的评论放进评论区）
sc.onload = () => fetch("/fakex/yt/youtubei/v1/next").then((r) => r.json()).then(() => {
  const t = document.getElementById("yt-comments"), box = document.querySelector("ytd-comments #contents");
  if (t && box) box.append(t.content.cloneNode(true));
}).catch(() => {});
document.body.appendChild(sc);
</script></body></html>
