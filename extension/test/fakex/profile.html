<style>body{font:15px/1.5 -apple-system,sans-serif;max-width:600px;margin:20px auto;background:#fff;color:#0f1419} article{border-bottom:1px solid #eee;padding:10px 16px;display:flow-root} [data-testid=User-Name]{white-space:pre;font-weight:600}</style>
</head><body><nav><a data-testid="AppTabBar_Profile_Link" id="me" href="/me_account">个人资料</a></nav><main><div data-testid="primaryColumn">

<div id="tl"></div></div></main><div id="layers"></div><script>
document.addEventListener("click", (e) => {
  const caret = e.target.closest('[data-testid="caret"]');
  const layers = document.getElementById("layers");
  if (!caret) { if (!e.target.closest('[role="menu"]')) layers.replaceChildren(); return; }
  const item = (t) => `<div role="menuitem" tabindex="0" class="x-mi"><div class="x-ic"><svg viewBox="0 0 24 24" width="18" height="18"><g><path d="M4 4h16v16H4z"></path></g></svg></div><div class="x-tx"><div dir="ltr"><span>${t}</span></div></div></div>`;
  layers.innerHTML = `<div role="menu" class="x-menu"><div><div data-testid="Dropdown">${item("不感兴趣这个帖子")}${item("屏蔽")}${item("举报帖子")}</div></div></div>`;
  // ?menu=split：模拟 X 分两次挂菜单——过一拍再往同一个菜单里挂第二组 Dropdown（只在容器里查重的旧逻辑会插两项）
  if (location.search.includes("menu=split")) setTimeout(() => {
    const g = document.createElement("div");
    g.innerHTML = `<div data-testid="Dropdown">${item("添加/移除列表")}</div>`;
    layers.querySelector('[role="menu"] > div').appendChild(g.firstElementChild);
  }, 0);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.getElementById("layers").replaceChildren(); });
</script>
<style>#layers .x-menu{position:fixed;top:80px;right:40px;background:#fff;box-shadow:0 0 15px rgba(0,0,0,.2);border-radius:12px;min-width:260px;font:700 15px -apple-system,sans-serif} .x-mi{display:flex;gap:12px;padding:12px 16px;cursor:pointer} .x-mi:hover{background:#f7f9f9} [data-testid=caret]{float:right}</style><script>
const V = {"posts": "<section role=\"region\"><div aria-label=\"时间线：Prof User 的帖子\"><div style=\"position:relative\"><div data-testid=\"cellInnerDiv\"><div><article data-testid=\"tweet\">\n  <div data-testid=\"User-Name\">Prof User\n@prof_user</div>\n  <a href=\"/prof_user/status/2001\"><time datetime=\"2026-10-10T01:10:00.000Z\">50分钟</time></a>\n  <div data-testid=\"tweetText\">今天发了新视频，聊聊最近玩的游戏</div>\n  <button data-testid=\"caret\" aria-label=\"更多\" type=\"button\">…</button></article></div></div><div data-testid=\"cellInnerDiv\"><div><article data-testid=\"tweet\">\n  <div data-testid=\"User-Name\">Prof User\n@prof_user</div>\n  <a href=\"/prof_user/status/2002\"><time datetime=\"2026-10-10T01:20:00.000Z\">40分钟</time></a>\n  <div data-testid=\"tweetText\">那个傻子又来了</div>\n  <button data-testid=\"caret\" aria-label=\"更多\" type=\"button\">…</button></article></div></div><div data-testid=\"cellInnerDiv\"><div><article data-testid=\"tweet\"><div data-testid=\"socialContext\">Prof User 已转帖</div>\n  <div data-testid=\"User-Name\">Other X\n@other_x</div>\n  <a href=\"/other_x/status/2003\"><time datetime=\"2026-10-10T01:25:00.000Z\">35分钟</time></a>\n  <div data-testid=\"tweetText\">露骨的合成测试文字</div>\n  <button data-testid=\"caret\" aria-label=\"更多\" type=\"button\">…</button></article></div></div><div data-testid=\"cellInnerDiv\"><div><article data-testid=\"tweet\">\n  <div data-testid=\"User-Name\">Prof User\n@prof_user</div>\n  <a href=\"/prof_user/status/2004\"><time datetime=\"2026-10-10T01:30:00.000Z\">30分钟</time></a>\n  <div data-testid=\"tweetText\">@someone_else 好</div>\n  <button data-testid=\"caret\" aria-label=\"更多\" type=\"button\">…</button></article></div></div><div data-testid=\"cellInnerDiv\"><div><article data-testid=\"tweet\">\n  <div data-testid=\"User-Name\">Prof User\n@prof_user</div>\n  <a href=\"/prof_user/status/2005\"><time datetime=\"2026-10-10T01:40:00.000Z\">20分钟</time></a>\n  <div data-testid=\"tweetText\">加我微信领资料，名额有限</div>\n  <button data-testid=\"caret\" aria-label=\"更多\" type=\"button\">…</button></article></div></div><div data-testid=\"cellInnerDiv\"><div><article data-testid=\"tweet\">\n  <div data-testid=\"User-Name\">Prof User\n@prof_user</div>\n  <a href=\"/prof_user/status/2007\"><time datetime=\"2026-10-10T01:52:00.000Z\">8分钟</time></a>\n  <div class=\"x-tr\"><svg width=\"12\" height=\"12\"></svg><span>翻译自 英语</span><button type=\"button\" aria-label=\"显示原文\">显示原文</button></div><div data-testid=\"tweetText\" lang=\"zh\">银河系在马达加斯加上空，和 @photo_friend 合作拍的。</div>\n  <button data-testid=\"caret\" aria-label=\"更多\" type=\"button\">…</button></article></div></div><div data-testid=\"cellInnerDiv\"><div><article data-testid=\"tweet\">\n  <div data-testid=\"User-Name\">Prof User\n@prof_user</div>\n  <a href=\"/prof_user/status/2008\"><time datetime=\"2026-10-10T01:54:00.000Z\">6分钟</time></a>\n  <div class=\"x-tr\"><svg width=\"12\" height=\"12\"></svg><span>翻译自 英语</span><button type=\"button\" aria-label=\"显示原文\">显示原文</button></div><div data-testid=\"tweetText\" lang=\"zh\">第二条翻译过的合成帖子，没有页面数据。</div>\n  <button data-testid=\"caret\" aria-label=\"更多\" type=\"button\">…</button></article></div></div><div data-testid=\"placementTracking\"><div data-testid=\"cellInnerDiv\"><div><article data-testid=\"tweet\"><div data-testid=\"User-Name\">Ad Corp\n@ad_corp</div><div data-testid=\"tweetText\">买它买它</div><div>广告</div></article></div></div></div></div></div></section>", "with_replies": "<section role=\"region\"><div aria-label=\"时间线：Prof User 的帖子\"><div style=\"position:relative\"><div data-testid=\"cellInnerDiv\"><div><article data-testid=\"tweet\">\n  <div data-testid=\"User-Name\">Other Y\n@other_y</div>\n  <a href=\"/other_y/status/2011\"><time datetime=\"2026-10-10T01:45:00.000Z\">15分钟</time></a>\n  <div data-testid=\"tweetText\">绞杀评论区的合成测试</div>\n  <button data-testid=\"caret\" aria-label=\"更多\" type=\"button\">…</button></article></div></div><div data-testid=\"cellInnerDiv\"><div><article data-testid=\"tweet\">\n  <div data-testid=\"User-Name\">Prof User\n@prof_user</div>\n  <a href=\"/prof_user/status/2012\"><time datetime=\"2026-10-10T01:50:00.000Z\">10分钟</time></a>\n  <div data-testid=\"tweetText\">我也这么觉得</div>\n  <button data-testid=\"caret\" aria-label=\"更多\" type=\"button\">…</button></article></div></div></div></div></section>"};
const q = new URLSearchParams(location.search);
if (q.get("self")) document.getElementById("me").setAttribute("href", "/" + q.get("self"));
document.getElementById("tl").innerHTML = V.posts;
// 仿 React 交给帖子组件的数据（pagedata.js 读它）：X 翻了的那条，原文在这里
const ORIG = {"2007": "The Milky Way over Madagascar, shot together with @photo_friend."};
for (const a of document.querySelectorAll("article")) {
  const id = (a.querySelector('a[href*="/status/"]')?.getAttribute("href").match(/status\/(\d+)/) || [])[1];
  if (ORIG[id]) a["__reactFiber$fake"] = { memoizedProps: {}, return: { memoizedProps: { tweet: { id_str: id, lang: "en", full_text: ORIG[id] } }, return: null } };
}
window.__tab = (t) => { history.pushState({}, "", "/prof_user/" + t + location.search); document.getElementById("tl").innerHTML = V[t]; };
history.replaceState({}, "", "/prof_user" + location.search); // 留着 ?jev=…（替身 Jev 读它）
const sc = document.createElement("script"); sc.src = "/inject_bundle.js"; document.body.appendChild(sc);
</script></body></html>
